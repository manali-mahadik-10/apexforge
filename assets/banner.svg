<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2447"/><stop offset="1" stop-color="#07142b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c2"/><stop offset="0.45" stop-color="#ffc65f"/><stop offset="1" stop-color="#d98a14"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f5991f"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a028" stop-opacity="0.42"/><stop offset="1" stop-color="#f5a028" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a7bff" stop-opacity="0.38"/><stop offset="1" stop-color="#3a7bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <circle cx="930" cy="210" r="270" fill="url(#glowBlue)"/>
  <circle cx="110" cy="30" r="270" fill="url(#glowGold)"/>

  <g fill="#ffe3a3">
    <circle cx="60" cy="380" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="40" r="1.4"><animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="390" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="60" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="50" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="370" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="200" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="400" r="1.3"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- rings -->
  <circle cx="930" cy="210" r="185" fill="none" stroke="#5a8fff" stroke-opacity="0.3" stroke-width="1.2"/>
  <circle cx="930" cy="210" r="150" fill="none" stroke="#f5b13c" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="6 7">
    <animateTransform attributeName="transform" type="rotate" from="0 930 210" to="360 930 210" dur="60s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="210" r="104" fill="none" stroke="#ffd27a" stroke-width="2">
    <animate attributeName="r" values="100;124;100" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- the 3D gold A (stacked layers give it depth) -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="190" text-anchor="middle">
    <text x="930" y="277" fill="#f5a028" opacity="0.5" filter="url(#blur)">A</text>
    <text x="937" y="284" fill="#3a2306">A</text>
    <text x="935" y="282" fill="#5c3a09">A</text>
    <text x="933" y="280" fill="#8a5a0c">A</text>
    <text x="931" y="278" fill="#b57410">A</text>
    <text x="930" y="277" fill="url(#gold)">A</text>
  </g>

  <!-- orbiting gold icons -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 930 210" to="360 930 210" dur="40s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 1080 210" to="-360 1080 210" dur="40s" repeatCount="indefinite"/>
      <circle cx="1080" cy="210" r="23" fill="#0a1a33" stroke="#f5b13c" stroke-width="1.8"/>
      <g transform="translate(1068 198)" fill="none" stroke="#f5b13c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l7 3v5c0 5-3.2 8.2-7 10-3.8-1.8-7-5-7-10V6l7-3z"/>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 1005 340" to="-360 1005 340" dur="40s" repeatCount="indefinite"/>
      <circle cx="1005" cy="340" r="23" fill="#0a1a33" stroke="#f5b13c" stroke-width="1.8"/>
      <g transform="translate(993 328)" fill="none" stroke="#f5b13c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 855 340" to="-360 855 340" dur="40s" repeatCount="indefinite"/>
      <circle cx="855" cy="340" r="23" fill="#0a1a33" stroke="#f5b13c" stroke-width="1.8"/>
      <g transform="translate(843 328)" fill="none" stroke="#f5b13c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3.5"/>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 780 210" to="-360 780 210" dur="40s" repeatCount="indefinite"/>
      <circle cx="780" cy="210" r="23" fill="#0a1a33" stroke="#f5b13c" stroke-width="1.8"/>
      <g transform="translate(768 198)" fill="none" stroke="#f5b13c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 855 80" to="-360 855 80" dur="40s" repeatCount="indefinite"/>
      <circle cx="855" cy="80" r="23" fill="#0a1a33" stroke="#f5b13c" stroke-width="1.8"/>
      <g transform="translate(843 68)" fill="none" stroke="#f5b13c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8c3-2 5-2 8-1 3-1 5-1 8 1 0 6-3 10-8 10S4 14 4 8z"/><path d="M8 11h2M14 11h2"/>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 1005 80" to="-360 1005 80" dur="40s" repeatCount="indefinite"/>
      <circle cx="1005" cy="80" r="23" fill="#0a1a33" stroke="#f5b13c" stroke-width="1.8"/>
      <g transform="translate(993 68)" fill="none" stroke="#f5b13c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h4l3-8 4 16 3-8h4"/>
      </g>
    </g>
  </g>

  <!-- left side text -->
  <text x="60" y="78" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#f5b13c">BLOCKCHAIN INSURANCE  &#8226;  SMART FUND DISBURSEMENT  &#8226;  LIVE ATTACKS</text>

  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="104">
    <text x="64" y="184" fill="#3a2306" opacity="0.8">ApexForge</text>
    <text x="60" y="180" fill="url(#goldH)">ApexForge</text>
  </g>

  <text x="60" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#f4efe4">Break it. Forge it.</text>
  <text x="60" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" font-style="italic" fill="url(#goldH)">Make it unbreakable.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#9db0cf">
    <text x="60" y="340" opacity="0">A blockchain-based insurance claiming system
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.30;0.38;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="340" opacity="0">Smart contracts that pay out claims automatically
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.30;0.38;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="340" opacity="0">Five live attacks. Only one system survives.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.30;0.38;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="60" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.5" fill="#6f84a8">SEM VII  &#8226;  BLOCKCHAIN TECHNOLOGY MINI PROJECT</text>

  <rect x="2" y="2" width="1196" height="416" rx="25" fill="none" stroke="#f5b13c" stroke-opacity="0.5" stroke-width="2"/>
</svg>